<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta por RUT - ACCIONA</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background:#f5f5f5;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .container{
        background:#ffffff;
        width:100%;
        max-width:500px;
        padding:35px;
        border-radius:15px;
        box-shadow:0 8px 25px rgba(0,0,0,0.15);
        border-top:6px solid #E30613;
    }

    .logo-area{
        text-align:center;
        margin-bottom:25px;
    }

    .logo-area h1{
        color:#E30613;
        font-size:32px;
        font-weight:700;
        letter-spacing:1px;
    }

    .logo-area p{
        color:#666;
        margin-top:5px;
    }

    h2{
        text-align:center;
        color:#333;
        margin-bottom:20px;
    }

    .input-group{
        display:flex;
        gap:10px;
    }

    input{
        flex:1;
        padding:12px;
        border:2px solid #ddd;
        border-radius:8px;
        font-size:16px;
        transition:0.3s;
    }

    input:focus{
        outline:none;
        border-color:#E30613;
        box-shadow:0 0 0 3px rgba(227,6,19,0.15);
    }

    button{
        background:#E30613;
        color:white;
        border:none;
        padding:12px 20px;
        border-radius:8px;
        cursor:pointer;
        font-size:15px;
        font-weight:600;
        transition:0.3s;
    }

    button:hover{
        background:#c40510;
        transform:translateY(-1px);
    }

    .resultado{
        margin-top:25px;
        padding:20px;
        border-radius:10px;
        background:#fafafa;
        border-left:5px solid #E30613;
        display:none;
    }

    .resultado h3{
        color:#E30613;
        margin-bottom:12px;
    }

    .resultado p{
        margin:8px 0;
        color:#333;
    }

    .error{
        color:#E30613;
        font-weight:bold;
    }

    .dato{
        padding:8px 0;
        border-bottom:1px solid #eee;
    }

    .dato:last-child{
        border-bottom:none;
    }
</style>

</head>
<body>

<div class="container">

    <div class="logo-area">
        <h1>ACCIONA</h1>
        <p>Consulta de Usuarios</p>
    </div>

    <h2>Buscar por RUT</h2>

    <div class="input-group">
        <input type="text" id="rutInput" placeholder="12345678-K">
        <button onclick="buscarPorRut()">Consultar</button>
    </div>

    <div id="resultado" class="resultado"></div>

</div>

<script>
async function buscarPorRut() {

    const rut = document.getElementById('rutInput').value.trim();
    const divResultado = document.getElementById('resultado');

    if (!rut) {
        alert('Por favor, ingresa un RUT');
        return;
    }

    try {

        const respuesta = await fetch(`https://locker-app.onrender.com/api/usuarios/${rut}`);
        const datos = await respuesta.json();

        divResultado.style.display = "block";

        if (respuesta.status === 404) {

            divResultado.innerHTML = `
                <p class="error">${datos.mensaje}</p>
            `;

        } else if (respuesta.ok) {

            divResultado.innerHTML = `
                <h3>✓ Datos Encontrados</h3>

                <div class="dato">
                    <strong>RUT:</strong> ${datos.rut}
                </div>

                <div class="dato">
                    <strong>Nombre:</strong> ${datos.nombre}
                </div>

                <div class="dato">
                    <strong>Locker:</strong> ${datos.locker}
                </div>

                <div class="dato">
                    <strong>Bolsa:</strong> ${datos.bolsa}
                </div>
            `;
        }

    } catch (error) {
        console.error(error);
        alert('No se pudo conectar con el servidor');
    }
}
</script>

</body>
</html>
