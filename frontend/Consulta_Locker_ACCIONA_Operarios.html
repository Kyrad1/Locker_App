<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Locker - ACCIONA</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #f5f5f5;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
        color: #333;
    }

    .container {
        background: #fff;
        width: 100%;
        max-width: 560px;
        padding: 32px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        border-top: 6px solid #E30613;
    }

    .logo-area {
        text-align: center;
        margin-bottom: 28px;
    }

    .logo-area h1 {
        color: #E30613;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 1px;
    }

    .logo-area p {
        color: #666;
        margin-top: 5px;
    }

    h2 {
        text-align: center;
        color: #333;
        margin-bottom: 8px;
        font-size: 22px;
    }

    .instruccion {
        text-align: center;
        color: #666;
        margin-bottom: 18px;
        font-size: 14px;
        line-height: 1.4;
    }

    .input-group {
        display: flex;
        gap: 10px;
    }

    input {
        flex: 1;
        min-width: 0;
        padding: 14px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 17px;
        transition: 0.2s;
        text-transform: uppercase;
    }

    input:focus {
        outline: none;
        border-color: #E30613;
        box-shadow: 0 0 0 3px rgba(227,6,19,0.12);
    }

    button {
        background: #E30613;
        color: #fff;
        border: none;
        padding: 13px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        transition: 0.2s;
    }

    button:hover {
        background: #c40510;
        transform: translateY(-1px);
    }

    button:disabled {
        background: #aaa;
        cursor: not-allowed;
        transform: none;
    }

    .ayuda-rut {
        text-align: center;
        color: #777;
        font-size: 12px;
        margin-top: 8px;
    }

    .resultado {
        margin-top: 25px;
        padding: 20px;
        border-radius: 10px;
        background: #fafafa;
        border-left: 5px solid #E30613;
        display: none;
    }

    .resultado h3 {
        color: #E30613;
        margin-bottom: 15px;
    }

    .estado {
        margin-bottom: 15px;
        padding: 11px 13px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
    }

    .estado.ok {
        background: #e7f7ed;
        color: #146c2e;
    }

    .estado.pendiente {
        background: #fff5df;
        color: #9a5b00;
    }

    .dato {
        padding: 14px 0;
        border-bottom: 1px solid #eee;
        font-size: 16px;
    }

    .dato:last-child {
        border-bottom: none;
    }

    .dato strong {
        display: block;
        color: #666;
        font-size: 12px;
        text-transform: uppercase;
        margin-bottom: 4px;
        letter-spacing: 0.4px;
    }

    .dato .valor {
        font-size: 20px;
        font-weight: 700;
        color: #222;
    }

    .dato.destacado {
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        padding: 15px;
        margin-top: 10px;
    }

    .dato.destacado .valor {
        font-size: 25px;
        color: #E30613;
    }

    .sin-asignar {
        color: #d97706 !important;
        font-size: 16px !important;
    }

    .error-box,
    .loading-box {
        text-align: center;
        padding: 10px 0;
    }

    .error-box .icono,
    .loading-box .icono {
        font-size: 30px;
        margin-bottom: 8px;
    }

    .error {
        color: #b00000;
        font-weight: 600;
        line-height: 1.4;
    }

    .loading {
        color: #666;
        font-style: italic;
    }

    .btn-nueva {
        width: 100%;
        margin-top: 18px;
        background: #555;
    }

    .btn-nueva:hover {
        background: #444;
    }

    @media (max-width: 600px) {
        body {
            align-items: flex-start;
        }

        .container {
            padding: 25px 18px;
            margin-top: 10px;
        }

        .input-group {
            flex-direction: column;
        }

        .input-group button {
            width: 100%;
        }

        .logo-area h1 {
            font-size: 28px;
        }

        .dato .valor {
            font-size: 19px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="logo-area">
        <h1>ACCIONA</h1>
        <p>Consulta de Locker</p>
    </div>

    <h2>Buscar por RUT</h2>

    <p class="instruccion">
        Ingresa tu RUT <strong>sin puntos ni guion</strong>, incluyendo el dígito verificador.
    </p>

    <div class="input-group">
        <input
            type="text"
            id="rutInput"
            placeholder="Ej: 12345678K"
            autocomplete="off"
            maxlength="9"
            inputmode="text"
            aria-label="RUT sin puntos ni guion"
        >

        <button type="button" id="btnConsultar" onclick="buscarPorRut()">
            Consultar
        </button>
    </div>

    <p class="ayuda-rut">Ejemplo: 12345678K</p>

    <div id="resultado" class="resultado" aria-live="polite"></div>

</div>

<script>

const API_URL = 'https://locker-app.onrender.com/api';

// =====================================================
// NORMALIZAR RUT
// =====================================================
function normalizarRut(valor) {
    return String(valor || '')
        .replace(/[^0-9kK]/g, '')
        .toUpperCase()
        .slice(0, 9);
}

// =====================================================
// VALIDAR RUT CHILENO
// =====================================================
function validarRut(rut) {

    if (!/^\d{7,8}[0-9K]$/.test(rut)) {
        return false;
    }

    const cuerpo = rut.slice(0, -1);
    const dvIngresado = rut.slice(-1);

    let suma = 0;
    let multiplicador = 2;

    for (let i = cuerpo.length - 1; i >= 0; i--) {

        suma += Number(cuerpo[i]) * multiplicador;

        multiplicador =
            multiplicador === 7
                ? 2
                : multiplicador + 1;
    }

    const resultado = 11 - (suma % 11);

    const dvCalculado =
        resultado === 11
            ? '0'
            : resultado === 10
                ? 'K'
                : String(resultado);

    return dvCalculado === dvIngresado;
}

// =====================================================
// BUSCAR USUARIO
// =====================================================
async function buscarPorRut() {

    const rutInput = document.getElementById('rutInput');
    const divResultado = document.getElementById('resultado');
    const btnConsultar = document.getElementById('btnConsultar');

    const rut = normalizarRut(rutInput.value);

    rutInput.value = rut;

    if (!rut) {

        mostrarError(
            '⚠️ Ingresa tu RUT para realizar la consulta.'
        );

        rutInput.focus();
        return;
    }

    if (!validarRut(rut)) {

        mostrarError(
            '⚠️ El RUT ingresado no es válido. Revisa los números y el dígito verificador.'
        );

        rutInput.focus();
        rutInput.select();
        return;
    }

    divResultado.style.display = 'block';

    divResultado.innerHTML = `
        <div class="loading-box">
            <div class="icono">🔎</div>
            <p class="loading">Consultando tu información...</p>
        </div>
    `;

    btnConsultar.disabled = true;
    btnConsultar.textContent = 'Consultando...';

    try {

        const respuesta = await fetch(
            `${API_URL}/usuarios/${encodeURIComponent(rut)}`
        );

        let datos = {};

        try {
            datos = await respuesta.json();
        } catch (_) {
            datos = {};
        }

        if (respuesta.status === 404) {

            mostrarNoEncontrado();
            return;
        }

        if (!respuesta.ok) {

            mostrarError(
                datos.mensaje ||
                'No se pudo realizar la consulta. Inténtalo nuevamente.'
            );

            return;
        }

        mostrarUsuario(datos);

    } catch (error) {

        console.error(error);

        mostrarError(
            '❌ No se pudo conectar con el servidor. Revisa tu conexión e inténtalo nuevamente.'
        );

    } finally {

        btnConsultar.disabled = false;
        btnConsultar.textContent = 'Consultar';
    }
}

// =====================================================
// MOSTRAR DATOS
// =====================================================
function mostrarUsuario(datos) {

    const divResultado = document.getElementById('resultado');

    const tieneLocker = Boolean(datos.locker);
    const tieneBolsa = Boolean(datos.bolsa);
    const tieneCandado = Boolean(datos.candado);

    const completo =
        tieneLocker &&
        tieneBolsa &&
        tieneCandado;

    divResultado.innerHTML = `

        <h3>✓ Información encontrada</h3>

        <div class="estado ${completo ? 'ok' : 'pendiente'}">

            ${
                completo
                    ? '🟢 Tu información está completa.'
                    : '🟡 Hay información que todavía no está asignada.'
            }

        </div>

        <div class="dato">

            <strong>RUT</strong>

            <div class="valor">
                ${escapeHtml(datos.rut)}
            </div>

        </div>

        <div class="dato">

            <strong>Nombre</strong>

            <div class="valor">
                ${escapeHtml(datos.nombre)}
            </div>

        </div>

        <div class="dato destacado">

            <strong>Tu locker</strong>

            <div class="valor ${
                tieneLocker ? '' : 'sin-asignar'
            }">

                ${
                    tieneLocker
                        ? escapeHtml(datos.locker)
                        : '⚠️ Sin asignar'
                }

            </div>

        </div>

        <div class="dato destacado">

            <strong>Número de bolsa</strong>

            <div class="valor ${
                tieneBolsa ? '' : 'sin-asignar'
            }">

                ${
                    tieneBolsa
                        ? escapeHtml(datos.bolsa)
                        : '⚠️ Sin asignar'
                }

            </div>

        </div>

        <div class="dato destacado">

            <strong>Número de candado</strong>

            <div class="valor ${
                tieneCandado ? '' : 'sin-asignar'
            }">

                ${
                    tieneCandado
                        ? escapeHtml(datos.candado)
                        : '⚠️ Sin asignar'
                }

            </div>

        </div>

        <button
            type="button"
            class="btn-nueva"
            onclick="nuevaConsulta()"
        >
            🔎 Nueva consulta
        </button>
    `;

    divResultado.style.display = 'block';
}

// =====================================================
// USUARIO NO ENCONTRADO
// =====================================================
function mostrarNoEncontrado() {

    const divResultado = document.getElementById('resultado');

    divResultado.style.display = 'block';

    divResultado.innerHTML = `

        <div class="error-box">

            <div class="icono">🔎</div>

            <p>
                <strong>No encontramos un usuario con ese RUT.</strong>
            </p>

            <p style="margin-top:8px;">
                Verifica que hayas ingresado correctamente tu RUT.
            </p>

        </div>
    `;
}

// =====================================================
// MOSTRAR ERROR
// =====================================================
function mostrarError(texto) {

    const divResultado = document.getElementById('resultado');

    divResultado.style.display = 'block';

    divResultado.innerHTML = `

        <div class="error-box">

            <div class="icono">⚠️</div>

            <p class="error">
                ${escapeHtml(texto)}
            </p>

        </div>
    `;
}

// =====================================================
// NUEVA CONSULTA
// =====================================================
function nuevaConsulta() {

    const rutInput =
        document.getElementById('rutInput');

    const divResultado =
        document.getElementById('resultado');

    rutInput.value = '';

    divResultado.innerHTML = '';

    divResultado.style.display = 'none';

    rutInput.focus();
}

// =====================================================
// PROTECCIÓN HTML
// =====================================================
function escapeHtml(valor) {

    if (valor === null || valor === undefined) {
        return '';
    }

    return String(valor)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

// =====================================================
// ENTER PARA CONSULTAR
// =====================================================
document
    .getElementById('rutInput')
    .addEventListener('keydown', function(event) {

        if (event.key === 'Enter') {

            event.preventDefault();

            buscarPorRut();
        }
    });

// =====================================================
// LIMPIAR RUT AL ESCRIBIR
// =====================================================
document
    .getElementById('rutInput')
    .addEventListener('input', function() {

        this.value = normalizarRut(this.value);
    });

</script>

</body>
</html>
