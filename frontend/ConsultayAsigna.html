<style>

</head>


<body>


<div class="container">


    <div class="logo-area">

        <h1>ACCIONA</h1>

        <p>Consulta de Usuarios</p>

    </div>


    <h2>Buscar por RUT</h2>


    <div class="input-group">

        <input
            type="text"
            id="rutInput"
            placeholder="12345678-K"
            autocomplete="off"
        >

        <button onclick="buscarPorRut()" id="btnConsultar">
            Consultar
        </button>

    </div>


    <div id="resultado" class="resultado"></div>


</div>


<script>


// =====================================================
// CONFIGURACIÓN
// =====================================================

const API_URL = 'https://locker-app.onrender.com/api';


// =====================================================
// BUSCAR USUARIO
// =====================================================

async function buscarPorRut() {

    const rutInput = document.getElementById('rutInput');

    const rut = rutInput.value.trim();

    const divResultado = document.getElementById('resultado');

    const btnConsultar = document.getElementById('btnConsultar');


    if (!rut) {

        alert('Por favor, ingresa un RUT');

        return;

    }


    // Mostrar resultado

    divResultado.style.display = 'block';

    divResultado.innerHTML = `
        <p class="loading">
            Consultando información...
        </p>
    `;


    btnConsultar.disabled = true;


    try {

        const respuesta = await fetch(
            `${API_URL}/usuarios/${encodeURIComponent(rut)}`
        );


        const datos = await respuesta.json();


        // -------------------------------------------------
        // USUARIO NO ENCONTRADO
        // -------------------------------------------------

        if (respuesta.status === 404) {

            divResultado.innerHTML = `
                <p class="error">
                    ${datos.mensaje}
                </p>
            `;

            return;

        }


        // -------------------------------------------------
        // ERROR
        // -------------------------------------------------

        if (!respuesta.ok) {

            divResultado.innerHTML = `
                <p class="error">
                    ${datos.mensaje || 'Ocurrió un error'}
                </p>
            `;

            return;

        }


        // -------------------------------------------------
        // USUARIO ENCONTRADO
        // -------------------------------------------------

        await mostrarUsuario(datos);


    } catch (error) {

        console.error(error);

        divResultado.innerHTML = `
            <p class="error">
                No se pudo conectar con el servidor.
            </p>
        `;

    } finally {

        btnConsultar.disabled = false;

    }

}


// =====================================================
// MOSTRAR USUARIO
// =====================================================

async function mostrarUsuario(datos) {

    const divResultado =
        document.getElementById('resultado');


    let html = `

        <h3>✓ Datos Encontrados</h3>

        <div class="dato">
            <strong>RUT:</strong>
            ${escapeHtml(datos.rut)}
        </div>

        <div class="dato">
            <strong>Nombre:</strong>
            ${escapeHtml(datos.nombre)}
        </div>

    `;


    // =================================================
    // LOCKER
    // =================================================

    if (datos.locker) {

        html += `

            <div class="dato">

                <strong>Locker:</strong>
                ${escapeHtml(datos.locker)}

            </div>

        `;

    } else {

        html += `

            <div class="dato">

                <strong>Locker:</strong>

                <span class="sin-asignar">
                    Sin asignar
                </span>

                <div
                    id="contenedorLocker"
                    class="asignacion"
                >

                    <div class="loading">
                        Cargando lockers disponibles...
                    </div>

                </div>

            </div>

        `;

    }


    // =================================================
    // BOLSA
    // =================================================

    if (datos.bolsa) {

        html += `

            <div class="dato">

                <strong>Bolsa:</strong>
                ${escapeHtml(datos.bolsa)}

            </div>

        `;

    } else {

        html += `

            <div class="dato">

                <strong>Bolsa:</strong>

                <span class="sin-asignar">
                    Sin asignar
                </span>

                <div
                    id="contenedorBolsa"
                    class="asignacion"
                >

                    <div class="loading">
                        Cargando bolsas disponibles...
                    </div>

                </div>

            </div>

        `;

    }


    divResultado.innerHTML = html;


    // =================================================
    // CARGAR LOCKERS
    // =================================================

    if (!datos.locker) {

        cargarLockers(datos.rut);

    }


    // =================================================
    // CARGAR BOLSAS
    // =================================================

    if (!datos.bolsa) {

        cargarBolsas(datos.rut);

    }

}


// =====================================================
// CARGAR LOCKERS DISPONIBLES
// =====================================================

async function cargarLockers(rut) {

    const contenedor =
        document.getElementById('contenedorLocker');


    if (!contenedor) return;


    try {

        const respuesta = await fetch(
            `${API_URL}/lockers/disponibles`
        );


        const lockers = await respuesta.json();


        if (!respuesta.ok) {

            throw new Error(
                lockers.mensaje ||
                'No se pudieron obtener los lockers'
            );

        }


        if (lockers.length === 0) {

            contenedor.innerHTML = `
                <p class="error">
                    No hay lockers disponibles.
                </p>
            `;

            return;

        }


        // ------------------------------------------------
        // Crear selector
        // ------------------------------------------------

        let opciones = `
            <option value="">
                Seleccionar locker...
            </option>
        `;


        lockers.forEach(locker => {

            opciones += `
                <option value="${escapeHtml(locker)}">
                    ${escapeHtml(locker)}
                </option>
            `;

        });


        contenedor.innerHTML = `

            <label>
                Selecciona un locker disponible:
            </label>

            <div class="asignacion-row">

                <select id="selectLocker">

                    ${opciones}

                </select>


                <button
                    class="btn-asignar"
                    onclick="asignarLocker('${escapeJs(rut)}')"
                >
                    Asignar
                </button>

            </div>


            <div
                id="mensajeLocker"
                class="mensaje"
            ></div>

        `;


    } catch (error) {

        console.error(error);

        contenedor.innerHTML = `

            <div class="mensaje error" style="display:block">

                No se pudieron cargar los lockers.

            </div>

        `;

    }

}


// =====================================================
// ASIGNAR LOCKER
// =====================================================

async function asignarLocker(rut) {

    const select =
        document.getElementById('selectLocker');

    const mensaje =
        document.getElementById('mensajeLocker');


    const locker = select.value;


    if (!locker) {

        mostrarMensaje(
            mensaje,
            'Selecciona un locker.',
            false
        );

        return;

    }


    select.disabled = true;


    try {

        const respuesta = await fetch(
            `${API_URL}/usuarios/${encodeURIComponent(rut)}/asignar`,
            {

                method: 'PUT',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                    locker: locker
                })

            }
        );


        const datos = await respuesta.json();


        if (!respuesta.ok) {

            mostrarMensaje(
                mensaje,
                datos.mensaje ||
                'No se pudo asignar el locker.',
                false
            );

            select.disabled = false;

            return;

        }


        mostrarMensaje(
            mensaje,
            '✓ Locker asignado correctamente.',
            true
        );


        // Esperar un momento y actualizar todo

        setTimeout(() => {

            mostrarUsuario(datos.usuario);

        }, 700);


    } catch (error) {

        console.error(error);

        mostrarMensaje(
            mensaje,
            'No se pudo conectar con el servidor.',
            false
        );

        select.disabled = false;

    }

}


// =====================================================
// CARGAR BOLSAS DISPONIBLES
// =====================================================

async function cargarBolsas(rut) {

    const contenedor =
        document.getElementById('contenedorBolsa');


    if (!contenedor) return;


    try {

        const respuesta = await fetch(
            `${API_URL}/bolsas/disponibles`
        );


        const bolsas = await respuesta.json();


        if (!respuesta.ok) {

            throw new Error(
                bolsas.mensaje ||
                'No se pudieron obtener las bolsas'
            );

        }


        if (bolsas.length === 0) {

            contenedor.innerHTML = `
                <p class="error">
                    No hay bolsas disponibles.
                </p>
            `;

            return;

        }


        // ------------------------------------------------
        // Crear opciones agrupadas por color
        // ------------------------------------------------

        let opciones = `
            <option value="">
                Seleccionar bolsa...
            </option>
        `;


        let ultimoColor = null;


        bolsas.forEach(bolsa => {

            const partes = bolsa.split('-');

            const color = partes[0];


            if (color !== ultimoColor) {

                opciones += `
                    <optgroup
                        label="${color.toUpperCase()}"
                    >
                `;

                ultimoColor = color;

            }


            opciones += `
                <option value="${escapeHtml(bolsa)}">
                    ${escapeHtml(bolsa)}
                </option>
            `;


            // Si es la última bolsa de ese color,
            // cerramos el optgroup.

            const siguiente = bolsas[
                bolsas.indexOf(bolsa) + 1
            ];


            if (
                !siguiente ||
                siguiente.split('-')[0] !== color
            ) {

                opciones += `
                    </optgroup>
                `;

            }

        });


        contenedor.innerHTML = `

            <label>
                Selecciona una bolsa disponible:
            </label>

            <div class="asignacion-row">

                <select id="selectBolsa">

                    ${opciones}

                </select>


                <button
                    class="btn-asignar"
                    onclick="asignarBolsa('${escapeJs(rut)}')"
                >
                    Asignar
                </button>

            </div>


            <div
                id="mensajeBolsa"
                class="mensaje"
            ></div>

        `;


    } catch (error) {

        console.error(error);

        contenedor.innerHTML = `

            <div
                class="mensaje error"
                style="display:block"
            >

                No se pudieron cargar las bolsas.

            </div>

        `;

    }

}


// =====================================================
// ASIGNAR BOLSA
// =====================================================

async function asignarBolsa(rut) {

    const select =
        document.getElementById('selectBolsa');

    const mensaje =
        document.getElementById('mensajeBolsa');


    const bolsa = select.value;


    if (!bolsa) {

        mostrarMensaje(
            mensaje,
            'Selecciona una bolsa.',
            false
        );

        return;

    }


    select.disabled = true;


    try {

        const respuesta = await fetch(
            `${API_URL}/usuarios/${encodeURIComponent(rut)}/asignar`,
            {

                method: 'PUT',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                    bolsa: bolsa
                })

            }
        );


        const datos = await respuesta.json();


        if (!respuesta.ok) {

            mostrarMensaje(
                mensaje,
                datos.mensaje ||
                'No se pudo asignar la bolsa.',
                false
            );

            select.disabled = false;

            return;

        }


        mostrarMensaje(
            mensaje,
            '✓ Bolsa asignada correctamente.',
            true
        );


        setTimeout(() => {

            mostrarUsuario(datos.usuario);

        }, 700);


    } catch (error) {

        console.error(error);

        mostrarMensaje(
            mensaje,
            'No se pudo conectar con el servidor.',
            false
        );

        select.disabled = false;

    }

}


// =====================================================
// MOSTRAR MENSAJE
// =====================================================

function mostrarMensaje(elemento, texto, exito) {

    elemento.style.display = 'block';

    elemento.className =
        exito
            ? 'mensaje exito'
            : 'mensaje error';

    elemento.textContent = texto;

}


// =====================================================
// PROTECCIÓN PARA HTML
// =====================================================

function escapeHtml(valor) {

    if (valor === null || valor === undefined) {
        return '';
    }

    return String(valor)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}


// =====================================================
// PROTECCIÓN PARA JAVASCRIPT
// =====================================================

function escapeJs(valor) {

    return String(valor)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'");

}


// =====================================================
// ENTER PARA CONSULTAR
// =====================================================

document
    .getElementById('rutInput')
    .addEventListener('keydown', function(event) {

        if (event.key === 'Enter') {

            buscarPorRut();

        }

    });

</script>


</body>

</html>
