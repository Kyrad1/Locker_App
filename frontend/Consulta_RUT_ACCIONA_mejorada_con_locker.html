    <div class="input-group">
        <input type="text" id="rutInput" placeholder="Ej: 12345678K"

<script>
const API_URL = 'https://locker-app.onrender.com/api';

function normalizarRut(valor) {
    return String(valor || '')
        .replace(/[^0-9kK]/g, '')
        .toUpperCase()
        .slice(0, 9);
}

function validarRut(rut) {
    if (!/^\d{7,8}[0-9K]$/.test(rut)) return false;

    const cuerpo = rut.slice(0, -1);
    const dvIngresado = rut.slice(-1);
    let suma = 0;
    let multiplicador = 2;

    for (let i = cuerpo.length - 1; i >= 0; i--) {
        suma += Number(cuerpo[i]) * multiplicador;
        multiplicador = multiplicador === 7 ? 2 : multiplicador + 1;
    }

    const resultado = 11 - (suma % 11);
    const dvCalculado = resultado === 11 ? '0'
        : resultado === 10 ? 'K'
        : String(resultado);

    return dvCalculado === dvIngresado;
}

async function buscarPorRut() {
    const rutInput = document.getElementById('rutInput');
    const divResultado = document.getElementById('resultado');
    const btnConsultar = document.getElementById('btnConsultar');
    const rut = normalizarRut(rutInput.value);

    rutInput.value = rut;

    if (!rut) {
        mostrarErrorResultado('⚠️ Ingresa un RUT para realizar la consulta.');
        rutInput.focus();
        return;
    }

    if (!validarRut(rut)) {
        mostrarErrorResultado('⚠️ El RUT ingresado no es válido. Revisa los números y el dígito verificador.');
        rutInput.focus();
        rutInput.select();
        return;
    }

    divResultado.style.display = 'block';
    divResultado.innerHTML = '<p class="loading">🔎 Consultando información...</p>';
    btnConsultar.disabled = true;

    try {
        const respuesta = await fetch(`${API_URL}/usuarios/${encodeURIComponent(rut)}`);
        let datos = {};
        try { datos = await respuesta.json(); } catch (_) {}

        if (respuesta.status === 404) {
            mostrarResultadoNoEncontrado();
            return;
        }

        if (!respuesta.ok) {
            mostrarErrorResultado(datos.mensaje || 'No se pudo realizar la consulta. Inténtalo nuevamente.');
            return;
        }

        mostrarUsuario(datos);
    } catch (error) {
        console.error(error);
        mostrarErrorResultado('❌ No se pudo conectar con el servidor. Revisa tu conexión e inténtalo nuevamente.');
    } finally {
        btnConsultar.disabled = false;
    }
}
async function liberarLocker() {
  if (!usuarioActual || !usuarioActual.rut) return;

  const confirmar = confirm(
    `¿Seguro que quieres liberar el locker ${usuarioActual.locker} de este usuario?`
  );

  if (!confirmar) return;

  const btn = document.getElementById('btnLiberarLocker');

  try {
    btn.disabled = true;
    btn.textContent = 'Liberando...';

    const response = await fetch(
      `${API_URL}/usuarios/${usuarioActual.rut}/liberar-locker`,
      {
        method: 'PUT'
      }
    );

    const datos = await response.json();

    if (!response.ok) {
      throw new Error(datos.mensaje || 'No se pudo liberar el locker');
    }

    usuarioActual = datos.usuario;

    mostrarUsuario(usuarioActual);

    alert('Locker liberado correctamente');

  } catch (error) {
    alert(error.message);

  } finally {
    btn.disabled = false;
    btn.textContent = 'Liberar locker';
  }
}

function mostrarUsuario(datos) {
    const divResultado = document.getElementById('resultado');
    const bolsaAsignada = Boolean(datos.bolsa);
    const candadoAsignado = Boolean(datos.candado);

    btnLiberarLocker.style.display =

    divResultado.innerHTML = `
        <h3>✓ Usuario encontrado</h3>

        <div class="estado ${todoAsignado ? 'ok' : 'pendiente'}">
            ${todoAsignado
                ? '🟢 Bolsa y candado están asignados.'
                : '🟡 Falta completar una o más asignaciones.'}
        </div>

        <div class="dato"><strong>RUT:</strong> ${escapeHtml(datos.rut)}</div>
        <div class="dato"><strong>Nombre:</strong> ${escapeHtml(datos.nombre)}</div>

        <div class="dato">
            <strong>Locker:</strong>
            <div class="asignacion">
                <label for="inputLocker">${datos.locker ? 'Editar número de locker' : 'Ingresar número de locker'}</label>
                <div class="asignacion-row">
                    <input type="text" id="inputLocker"
                           value="${escapeHtml(datos.locker || '')}"
                           placeholder="Ej: 999" maxlength="100"
                           autocomplete="off">
                    <button type="button" class="btn-asignar" id="btnLocker"
                            onclick="guardarLocker('${escapeJs(datos.rut)}')">
                        ${datos.locker ? 'Guardar cambios' : 'Asignar locker'}
                    </button>

                            Liberar locker

                </div>

                <div class="asignacion-row">
                    <input type="text" id="inputBolsa"
                           value="${escapeHtml(datos.bolsa || '')}"

                    <button type="button" class="btn-asignar" id="btnCandado"
                            onclick="guardarCandado('${escapeJs(datos.rut)}')">
                        ${datos.candado ? 'Guardar cambios' : 'Asignar candado'}
                    </button>
                </div>
                <small>Solo números. Entre 1 y 10 dígitos. Los ceros iniciales están permitidos.</small>
                <div id="mensajeCandado" class="mensaje"></div>
            </div>
        </div>

        <button type="button" class="btn-secundario" onclick="nuevaConsulta()">
            🔎 Nueva consulta
        </button>
    `;
    divResultado.style.display = 'block';
}

async function guardarLocker(rut) {
    const input = document.getElementById('inputLocker');
    const mensaje = document.getElementById('mensajeLocker');
    const boton = document.getElementById('btnLocker');
    if (!input || !mensaje || !boton) return;

    const locker = input.value.trim();

    if (!locker) {
        mostrarMensaje(mensaje, '⚠️ Debes indicar un número de locker.', false);
        input.focus();
        return;
    }

    input.disabled = true;
    boton.disabled = true;
    boton.textContent = 'Guardando...';

    try {
        const respuesta = await fetch(`${API_URL}/usuarios/${encodeURIComponent(rut)}/asignar`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ locker })
        });

        let datos = {};
        try { datos = await respuesta.json(); } catch (_) {}

        if (!respuesta.ok) {
            mostrarMensaje(mensaje, convertirError(datos.mensaje || 'No se pudo guardar el locker.'), false);
            input.disabled = false;
            boton.disabled = false;
            boton.textContent = 'Guardar cambios';
            return;
        }

        mostrarMensaje(mensaje, '✓ Locker guardado correctamente.', true);

        if (datos.usuario) {
            setTimeout(() => mostrarUsuario(datos.usuario), 900);
        }
    } catch (error) {
        console.error(error);
        mostrarMensaje(mensaje, '❌ No se pudo conectar con el servidor. Inténtalo nuevamente.', false);
        input.disabled = false;
        boton.disabled = false;
        boton.textContent = 'Guardar cambios';
    }
}

function limitarNumero(input) {
    input.value = input.value.replace(/\D/g, '').slice(0, 10);
}

function mostrarMensaje(elemento, texto, exito) {
    elemento.style.display = 'block';
    elemento.className = exito ? 'mensaje exito' : 'mensaje error';
    elemento.textContent = texto;
}

function mostrarErrorResultado(texto) {
    const divResultado = document.getElementById('resultado');
    divResultado.style.display = 'block';
    divResultado.innerHTML = `
        <div class="resultado-vacio">
            <div class="icono">⚠️</div>
            <p class="error">${escapeHtml(texto)}</p>
        </div>`;
}

function mostrarResultadoNoEncontrado() {
    const divResultado = document.getElementById('resultado');
    divResultado.style.display = 'block';
    divResultado.innerHTML = `
        <div class="resultado-vacio">
            <div class="icono">🔎</div>
            <p><strong>No se encontró el usuario.</strong></p>
            <p>Verifica que el RUT esté correctamente escrito.</p>
        </div>`;
}

function convertirError(mensaje) {
    const texto = String(mensaje || '');

    if (/bolsa.*(duplic|existe|asign)/i.test(texto)) {
        return '⚠️ Esta bolsa ya está asignada a otro usuario. Verifica el número ingresado.';
    }

    if (/candado.*(duplic|existe|asign)/i.test(texto)) {
        return '⚠️ Este candado ya está asignado a otro usuario. Verifica el número ingresado.';
    }

    return texto;
}

function nuevaConsulta() {
    const rutInput = document.getElementById('rutInput');
    const divResultado = document.getElementById('resultado');
    rutInput.value = '';
    divResultado.innerHTML = '';
    divResultado.style.display = 'none';
    rutInput.focus();
}

function escapeHtml(valor) {
    if (valor === null || valor === undefined) return '';
    return String(valor)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function escapeJs(valor) {
    return String(valor)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'");
}

document.getElementById('rutInput').addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        event.preventDefault();
        buscarPorRut();
    }
});

document.getElementById('rutInput').addEventListener('input', function() {
    this.value = normalizarRut(this.value);
});

document
  .getElementById('btnLiberarLocker')
  .addEventListener('click', liberarLocker);
</script>
